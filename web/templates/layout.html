<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · AI Model Scheduler</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">AI Model Scheduler</span>
    <nav>
      <a href="/" {{if eq .Active "dashboard"}}class="active"{{end}}>Dashboard</a>
      <a href="/deploy" {{if eq .Active "deploy"}}class="active"{{end}}>Deploy</a>
      <a href="/models" {{if eq .Active "models"}}class="active"{{end}}>Models</a>
      <a href="/downloads" {{if eq .Active "downloads"}}class="active"{{end}}>Downloads</a>
    </nav>
    <div class="health" hx-get="/partials/health" hx-trigger="load, every 10s"></div>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
