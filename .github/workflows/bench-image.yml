name: bench image

# Publishes the benchmark eval image the app dispatches on the box.
# Default image reference in the app: ghcr.io/<owner>/ai-model-scheduler-bench:latest
on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bench
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-model-scheduler-bench:latest
            ghcr.io/${{ github.repository_owner }}/ai-model-scheduler-bench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
