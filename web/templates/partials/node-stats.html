{{define "partial:node-stats"}}
{{range .}}
<div class="tile-row">
  <div class="tile">
    <div class="tile-label">Node</div>
    <div class="tile-value">{{.NodeName}}</div>
    <div class="muted">{{.Status}} · up {{.Uptime}}</div>
  </div>
  <div class="tile">
    <div class="tile-label">CPU</div>
    <div class="tile-value">{{printf "%.0f%%" .CPUPercent}}</div>
    <div class="meter"><div class="meter-fill {{meterClass .CPUPercent}}" style="width: {{meterWidth .CPUPercent}}%"></div></div>
  </div>
  <div class="tile">
    <div class="tile-label">Memory</div>
    <div class="tile-value">{{printf "%.0f%%" .MemPercent}}</div>
    <div class="muted">{{humanBytes .MemUsed}} / {{humanBytes .MemTotal}}</div>
    <div class="meter"><div class="meter-fill {{meterClass .MemPercent}}" style="width: {{meterWidth .MemPercent}}%"></div></div>
  </div>
</div>
{{else}}
<p class="muted">No client nodes found.</p>
{{end}}
{{end}}
