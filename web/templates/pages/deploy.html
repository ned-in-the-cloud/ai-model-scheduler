{{define "content"}}
<h1>Deploy a model</h1>

{{with .Data}}
{{if .Error}}<section class="card error-card">{{.Error}}</section>{{end}}
<section class="card">
  <form class="stack" method="post" action="/deploy">
    <label>Name
      <input name="name" required pattern="[a-z0-9][a-z0-9-]{0,30}"
             placeholder="llama3-8b" value="{{.Params.Name}}">
    </label>
    <label>Runtime
      <select name="runtime">
        <option value="llamacpp" {{if eq .Params.Runtime "llamacpp"}}selected{{end}}>llama.cpp (GGUF)</option>
        <option value="vllm" {{if eq .Params.Runtime "vllm"}}selected{{end}}>vLLM (HF directory, GPU)</option>
        <option value="ollama" {{if eq .Params.Runtime "ollama"}}selected{{end}}>Ollama (server only)</option>
      </select>
    </label>
    <label>Model path <span class="muted">(relative to the model share; empty for Ollama)</span>
      <input name="model" list="model-list" placeholder="llama3-8b-q4.gguf" value="{{.Params.Model}}">
      <datalist id="model-list">
        {{range .Models}}<option value="{{.Path}}">{{if eq .Kind "gguf"}}GGUF{{else}}HF dir{{end}} · {{humanBytes .SizeBytes}}</option>{{end}}
      </datalist>
    </label>
    <label>Port
      <input name="port" type="number" value="{{if .Params.Port}}{{.Params.Port}}{{else}}{{.SuggestedPort}}{{end}}">
    </label>
    <label>GPU
      <div class="gpu-select"
           hx-get="/partials/gpus?gpu={{.Params.GPU}}" hx-trigger="load" hx-swap="innerHTML">
        <select name="gpu"><option value="">None (CPU)</option></select>
        <span class="muted">Detecting GPUs…</span>
      </div>
    </label>
    <label>Context size <span class="muted">(tokens; empty = model default)</span>
      <input name="ctx_size" type="number" value="{{if .Params.CtxSize}}{{.Params.CtxSize}}{{end}}">
    </label>
    <label>Threads <span class="muted">(llama.cpp only; empty = auto)</span>
      <input name="threads" type="number" value="{{if .Params.Threads}}{{.Params.Threads}}{{end}}">
    </label>
    <label>GPU layers <span class="muted">(llama.cpp only; empty = offload all layers)</span>
      <input name="gpu_layers" type="number" value="{{if .Params.GPULayers}}{{.Params.GPULayers}}{{end}}">
    </label>
    <label>Environment variables <span class="muted">(one KEY=VALUE per line)</span>
      <textarea name="env" rows="3"
                placeholder="HSA_OVERRIDE_GFX_VERSION=12.0.1">{{if .EnvText}}{{.EnvText}}{{else}}{{envLines .Params.Env}}{{end}}</textarea>
    </label>
    <label>Extra arguments <span class="muted">(appended to the server command line)</span>
      <input name="extra_args" value="{{.Params.ExtraArgs}}" placeholder="--flash-attn on -np 4">
      <span class="muted">llama.cpp: <code>--flash-attn on</code> · <code>--cache-type-k q8_0</code> · <code>-np 4</code> (parallel slots)</span>
      <span class="muted">vLLM: <code>--gpu-memory-utilization 0.9</code> · <code>--max-num-seqs 8</code> · <code>--quantization awq</code></span>
    </label>
    <label>CPU reservation (MHz) <span class="muted">(Nomad scheduling reservation, not a hard cap; default 1000)</span>
      <input name="cpu_mhz" type="number" value="{{if .Params.CPUMHz}}{{.Params.CPUMHz}}{{end}}">
    </label>
    <label>Memory limit (MB) <span class="muted">(hard limit — the container is killed if it exceeds this; default 8192)</span>
      <input name="mem_mb" type="number" value="{{if .Params.MemMB}}{{.Params.MemMB}}{{end}}">
    </label>
    <div><button type="submit">Deploy</button></div>
  </form>
</section>
{{end}}
{{end}}
